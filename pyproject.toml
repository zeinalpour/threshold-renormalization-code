[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "threshold-w2sg"
version = "1.0.0"
description = "Reproducible experiments for two-stage threshold renormalization"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "numpy>=2.1,<3",
  "scipy>=1.14,<2",
  "pandas>=2.2,<3",
  "matplotlib>=3.9,<4",
  "PyYAML>=6,<7",
  "threadpoolctl>=3.5,<4",
]

[project.scripts]
threshold-w2sg = "threshold_w2sg.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

