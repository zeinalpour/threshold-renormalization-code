profile_name: publication
output_dir: results/publication
base_seed: 20260827
p_values: [128, 256, 512, 1024]
replicates: 300
bootstrap_resamples: 10000
workers: 6
model:
  gamma: 0.75
  delta: 0.5
  nu1: 0.05
  nu2: 0.20
cases:
  - {id: comparable_improve, label: "Comparable: improve", alpha1: 1.25, alpha2: 1.25}
  - {id: comparable_deteriorate, label: "Comparable: deteriorate", alpha1: 1.65, alpha2: 1.65}
  - {id: stronger_improve, label: "Stronger II: improve", alpha1: 1.25, alpha2: 1.60}
  - {id: stronger_deteriorate, label: "Stronger II: deteriorate", alpha1: 1.65, alpha2: 1.70}
  - {id: weaker_improve, label: "Weaker II: improve", alpha1: 1.30, alpha2: 1.20}
  - {id: weaker_deteriorate, label: "Weaker II: deteriorate", alpha1: 1.55, alpha2: 1.20}
solver:
  kkt_tolerance: 1.0e-8
  max_iterations: 20000
  check_every: 10
  power_iterations: 100
  spectral_safety: 1.05
state_evolution:
  quadrature_nodes: 512
  tolerance: 1.0e-11
  max_iterations: 4000
  damping: 0.60
